Categories:
  - VPN & Proxy
License: MIT
AuthorName: Detour contributors
SourceCode: https://github.com/arttvad9r/detour
IssueTracker: https://github.com/arttvad9r/detour/issues
Changelog: https://github.com/arttvad9r/detour/blob/main/CHANGELOG.md

AutoName: Detour

RepoType: git
Repo: https://github.com/arttvad9r/detour.git

# Upstream recipe for the first reproducible F-Droid-ready release.
Builds:
  - versionName: 0.2.1
    versionCode: 2001
    commit: v0.2.1
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y g++ make
      - apt-get install -t trixie-backports golang-go
    srclibs:
      - go@go1.26.7
    prebuild:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - printf '\ndetourGoBinary=%s/bin/go\n' "$$go$$" >> ../gradle.properties
    scanignore:
      - engine/mihomo/go/vendor/golang.org/x/net/publicsuffix/data/nodes
      - engine/mihomo/go/vendor/golang.org/x/net/publicsuffix/data/children
      - engine/mihomo/go/vendor/github.com/metacubex/zerotier-go/default_planet.bin
    scandelete:
      - engine/mihomo/go/vendor/github.com/vmihailenco/msgpack/v5/package.json
    gradle:
      - yes
    gradleprops:
      - detourReleaseAbi=arm64-v8a
      - detourVersionName=0.2.1
      - detourVersionCode=2001
    ndk: r28

# Automatic tag discovery remains disabled until the historical v0.2.0 tag
# and the preferred long-term release/update policy have been reviewed for
# fdroiddata. The tested inclusion candidate is v0.2.1 above.
AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 0.2.1
CurrentVersionCode: 2001
