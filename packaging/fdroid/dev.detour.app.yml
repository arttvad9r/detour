Categories:
  - Connectivity
License: MIT
SourceCode: https://github.com/arttvad9r/detour
IssueTracker: https://github.com/arttvad9r/detour/issues
Changelog: https://github.com/arttvad9r/detour/releases

RepoType: git
Repo: https://github.com/arttvad9r/detour.git

Builds:
  - versionName: 0.1.2
    versionCode: 1002
    commit: v0.1.2
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-go
      - apt-get install -y build-essential
    srclibs:
      - go@go1.26.7
    prebuild:
      - sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - git -C $$go$$ checkout -f go1.26.7
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - test "$(go env GOVERSION)" = go1.26.7
      - export ANDROID_NDK_HOME=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
      - gradle --no-daemon --stacktrace --dependency-verification strict :app:assembleRelease -PdetourVersionName=$$VERSION$$ -PdetourVersionCode=$$VERCODE$$
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    ndk: 28.0.13004108

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.2
CurrentVersionCode: 1002
