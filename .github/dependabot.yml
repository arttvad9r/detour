version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      compatible-gradle:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /engine/mihomo/go
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      compatible-actions:
        patterns: ['*']
        update-types: [minor, patch]
