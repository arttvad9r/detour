name: Apply multi WireGuard refactor

on:
  push:
    branches:
      - feat/multiple-wireguard-profiles
    paths:
      - tools/apply_multi_wg.py
      - .github/workflows/apply-multi-wg.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multiple-wireguard-profiles
          fetch-depth: 0
      - name: Apply refactor
        run: python3 tools/apply_multi_wg.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support multiple WireGuard profiles"
          git push origin HEAD:feat/multiple-wireguard-profiles
