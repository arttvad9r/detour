name: Fix sing-box TLS normalization

on:
  push:
    branches: [feature/vpn-roadmap]
    paths:
      - .github/workflows/fix-singbox-tls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/vpn-roadmap
      - name: Patch TLS normalization
        shell: python
        run: |
          from pathlib import Path
          path = Path("engine/mihomo/go/subscription_singbox.go")
          text = path.read_text()
          text = text.replace(
              '\tproxy["tls"] = true\n',
              '\tif mihomoType != "trojan" {\n\t\tproxy["tls"] = true\n\t}\n',
              1,
          )
          old = '''\t\tif rawTransport, exists := fields["transport"]; exists {\n\t\t\tif !applySingBoxTransport(proxy, rawTransport) {\n\t\t\t\treturn nil, false\n\t\t\t}\n\t\t}\n'''
          new = '''\t\tif rawTransport, exists := fields["transport"]; exists {\n\t\t\tif !applySingBoxTransport(proxy, rawTransport) {\n\t\t\t\treturn nil, false\n\t\t\t}\n\t\t}\n\t\tensureSingBoxTransportTLSName(proxy, mihomoType)\n'''
          if old not in text:
              raise SystemExit("transport target not found")
          text = text.replace(old, new, 1)
          marker = 'func singBoxAllowedOutboundFields(mihomoType string) map[string]struct{} {'
          helper = '''func ensureSingBoxTransportTLSName(proxy map[string]any, mihomoType string) {\n\tkey := "servername"\n\tif mihomoType == "trojan" {\n\t\tkey = "sni"\n\t} else if tls, _ := proxy["tls"].(bool); !tls {\n\t\treturn\n\t}\n\tif value, _ := proxy[key].(string); strings.TrimSpace(value) != "" {\n\t\treturn\n\t}\n\tif network, _ := proxy["network"].(string); network != "ws" {\n\t\treturn\n\t}\n\twsOpts, _ := proxy["ws-opts"].(map[string]any)\n\theaders, _ := wsOpts["headers"].(map[string]string)\n\tfor header, value := range headers {\n\t\tif strings.EqualFold(header, "Host") && strings.TrimSpace(value) != "" {\n\t\t\tproxy[key] = strings.TrimSpace(value)\n\t\t\treturn\n\t\t}\n\t}\n}\n\n'''
          if marker not in text:
              raise SystemExit("helper marker not found")
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
      - name: Commit TLS fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/mihomo/go/subscription_singbox.go
          git commit -m 'Fix sing-box Trojan TLS and WS SNI mapping'
          git push origin HEAD:feature/vpn-roadmap
