name: Refresh dependency verification metadata

on:
  push:
    branches:
      - feature/vpn-roadmap
    paths:
      - .github/workflows/refresh-verification.yml
      - gradle/libs.versions.toml
      - app/build.gradle.kts

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108'
      - name: Generate verification metadata
        run: ./gradlew --write-verification-metadata sha256 :app:dependencies
      - name: Commit verification metadata
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "Verification metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "Trust WorkManager dependency artifacts"
          git push origin HEAD:feature/vpn-roadmap
