name: Fix sing-box unused variable

on:
  push:
    branches: [feature/vpn-roadmap]
    paths:
      - .github/workflows/fix-singbox-unused.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/vpn-roadmap
      - name: Patch unused variable
        shell: python
        run: |
          from pathlib import Path
          path = Path("engine/mihomo/go/subscription_singbox.go")
          text = path.read_text()
          old = '\trawOutbounds, ok := envelope["outbounds"]\n'
          new = '\t_, ok := envelope["outbounds"]\n'
          if old not in text:
              raise SystemExit("target not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/mihomo/go/subscription_singbox.go
          git commit -m 'Fix sing-box parser build'
          git push origin HEAD:feature/vpn-roadmap
