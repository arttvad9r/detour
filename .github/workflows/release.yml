name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate distribution licensing
        shell: bash
        run: |
          set -euo pipefail
          test -f THIRD_PARTY_NOTICES.md || {
            echo "THIRD_PARTY_NOTICES.md is required for binary distribution" >&2
            exit 1
          }
          test -f LICENSE || {
            echo "A project-owner-selected root LICENSE is required before distributing Detour binaries" >&2
            exit 1
          }
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match canonical vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( ${#MAJOR} > 4 || ${#MINOR} > 3 || ${#PATCH} > 3 )); then
            echo "Release version components exceed Android versionCode bounds" >&2
            exit 1
          fi
          if (( 10#$MAJOR > 2100 || 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "MAJOR must be <= 2100; MINOR and PATCH must be <= 999" >&2
            exit 1
          fi

          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Computed Android versionCode is out of range: $VERSION_CODE" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

          VERSION_NAME="${TAG#v}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=detour-$VERSION_NAME-arm64.apk" >> "$GITHUB_ENV"
      - name: Require successful Android CI on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS_JSON="$(
            gh run list \
              --workflow Android \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 20 \
              --json conclusion,headSha
          )"
          SUCCESSFUL_RUNS="$(
            printf '%s' "$RUNS_JSON" |
              jq --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success")] | length'
          )"
          if [[ "$SUCCESSFUL_RUNS" -lt 1 ]]; then
            echo "Release commit must have a successful Android push workflow on main" >&2
            exit 1
          fi
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DETOUR_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DETOUR_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DETOUR_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DETOUR_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.DETOUR_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret backing $name" >&2
              missing=1
            fi
          done
          normalized="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -n "$EXPECTED_CERT_SHA256" && ! "$normalized" =~ ^[0-9A-F]{64}$ ]]; then
            echo "DETOUR_RELEASE_CERT_SHA256 must be a SHA-256 certificate fingerprint" >&2
            missing=1
          fi
          exit "$missing"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true
          cache-dependency-path: engine/mihomo/go/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108'
      - name: Export Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install Go tooling
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
      - name: Verify app tests and lint
        run: >-
          ./gradlew --dependency-verification strict
          :app:testDebugUnitTest
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebug
          :app:assembleDebugAndroidTest
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DETOUR_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/detour-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - name: Build signed arm64 release APK
        env:
          DETOUR_RELEASE_KEYSTORE: ${{ runner.temp }}/detour-release.keystore
          DETOUR_RELEASE_STORE_PASSWORD: ${{ secrets.DETOUR_RELEASE_STORE_PASSWORD }}
          DETOUR_RELEASE_KEY_ALIAS: ${{ secrets.DETOUR_RELEASE_KEY_ALIAS }}
          DETOUR_RELEASE_KEY_PASSWORD: ${{ secrets.DETOUR_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -PdetourReleaseAbi=arm64-v8a
          -PdetourVersionName="$VERSION_NAME"
          -PdetourVersionCode="$VERSION_CODE"
      - name: Verify embedded engine vulnerabilities
        run: bash engine/vulnscan.sh
      - name: Verify release APK
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.DETOUR_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "Release APK not found" >&2
            exit 1
          fi

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              head -n 1 |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]'
          )"
          EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Release signing certificate mismatch" >&2
            echo "Expected: $EXPECTED_CERT_SHA256" >&2
            echo "Actual:   $ACTUAL_CERT_SHA256" >&2
            exit 1
          fi

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          python3 tools/check_elf_alignment.py "$APK" \
            --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 tools/apk_size_report.py "$APK" \
            --report app/build/reports/apk-size-release.json \
            --max-bytes 31457280 \
            --expected-abi arm64-v8a

          ARTIFACT_DIR="app/build/release-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          ARTIFACT="$ARTIFACT_DIR/$APK_NAME"
          cp "$APK" "$ARTIFACT"
          (cd "$ARTIFACT_DIR" && sha256sum "$(basename "$ARTIFACT")") > "$ARTIFACT.sha256"
          echo "RELEASE_APK=$ARTIFACT" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$ARTIFACT.sha256" >> "$GITHUB_ENV"
      - name: Upload signed release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: detour-${{ env.VERSION_NAME }}-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/release-artifacts/*
            app/build/reports/apk-size-release.json
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_APK" "$RELEASE_SHA256"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_SHA256" \
              --verify-tag \
              --generate-notes \
              --title "Detour $VERSION_NAME"
