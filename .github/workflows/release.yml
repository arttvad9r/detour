name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match canonical vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # Bound decimal widths before Bash arithmetic. Otherwise a malicious or
          # accidental tag with hundreds of digits can overflow the shell integer
          # while evaluating 10#VALUE and potentially wrap into a valid-looking code.
          if (( ${#MAJOR} > 4 || ${#MINOR} > 3 || ${#PATCH} > 3 )); then
            echo "Release version components exceed Android versionCode bounds" >&2
            exit 1
          fi
          if (( 10#$MAJOR > 2100 || 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "MAJOR must be <= 2100; MINOR and PATCH must be <= 999" >&2
            exit 1
          fi

          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Computed Android versionCode is out of range: $VERSION_CODE" >&2
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag must point to a commit contained in master" >&2
            exit 1
          fi

          VERSION_NAME="${TAG#v}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=detour-$VERSION_NAME-arm64.apk" >> "$GITHUB_ENV"
          echo "AAB_NAME=detour-$VERSION_NAME.aab" >> "$GITHUB_ENV"
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DETOUR_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DETOUR_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DETOUR_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DETOUR_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret backing $name" >&2
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true
          cache-dependency-path: engine/mihomo/go/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108'
      - name: Export Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install Go tooling
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
      - name: Verify app tests and lint
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DETOUR_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/detour-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - name: Build signed release artifacts
        env:
          DETOUR_RELEASE_KEYSTORE: ${{ runner.temp }}/detour-release.keystore
          DETOUR_RELEASE_STORE_PASSWORD: ${{ secrets.DETOUR_RELEASE_STORE_PASSWORD }}
          DETOUR_RELEASE_KEY_ALIAS: ${{ secrets.DETOUR_RELEASE_KEY_ALIAS }}
          DETOUR_RELEASE_KEY_PASSWORD: ${{ secrets.DETOUR_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PdetourReleaseAbi=arm64-v8a \
            -PdetourVersionName="$VERSION_NAME" \
            -PdetourVersionCode="$VERSION_CODE"
          ./gradlew :app:bundleRelease \
            -PdetourVersionName="$VERSION_NAME" \
            -PdetourVersionCode="$VERSION_CODE"
      - name: Verify embedded engine vulnerabilities
        run: bash engine/vulnscan.sh
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [[ -z "$APK" || -z "$AAB" ]]; then
            echo "Signed release APK or AAB not found" >&2
            exit 1
          fi

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          bash tools/verify_aab_signature.sh "$AAB"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          python3 tools/check_elf_alignment.py "$APK" \
            --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 tools/verify_baseline_profile.py "$APK"
          python3 tools/verify_baseline_profile.py "$AAB"
          python3 tools/apk_size_report.py "$APK" \
            --report app/build/reports/apk-size-release.json \
            --max-bytes 31457280 \
            --expected-abi arm64-v8a

          python3 - "$AAB" <<'PY'
          import sys
          from zipfile import ZipFile

          expected = ["arm64-v8a", "x86_64"]
          with ZipFile(sys.argv[1]) as archive:
              abis = sorted({
                  path.split("/")[2]
                  for path in archive.namelist()
                  if path.startswith("base/lib/") and path.endswith(".so") and len(path.split("/")) >= 4
              })
          if abis != expected:
              raise SystemExit(f"AAB ABI set {abis} does not match expected {expected}")
          print(f"Verified AAB ABI set: {', '.join(abis)}")
          PY

          ARTIFACT_DIR="app/build/release-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          APK_ARTIFACT="$ARTIFACT_DIR/$APK_NAME"
          AAB_ARTIFACT="$ARTIFACT_DIR/$AAB_NAME"
          cp "$APK" "$APK_ARTIFACT"
          cp "$AAB" "$AAB_ARTIFACT"
          sha256sum "$APK_ARTIFACT" > "$APK_ARTIFACT.sha256"
          sha256sum "$AAB_ARTIFACT" > "$AAB_ARTIFACT.sha256"
          echo "RELEASE_APK=$APK_ARTIFACT" >> "$GITHUB_ENV"
          echo "RELEASE_APK_SHA256=$APK_ARTIFACT.sha256" >> "$GITHUB_ENV"
          echo "RELEASE_AAB=$AAB_ARTIFACT" >> "$GITHUB_ENV"
          echo "RELEASE_AAB_SHA256=$AAB_ARTIFACT.sha256" >> "$GITHUB_ENV"
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: detour-${{ env.VERSION_NAME }}-release
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/release-artifacts/*
            app/build/reports/apk-size-release.json
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RELEASE_APK" "$RELEASE_APK_SHA256" \
              "$RELEASE_AAB" "$RELEASE_AAB_SHA256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_APK_SHA256" \
              "$RELEASE_AAB" \
              "$RELEASE_AAB_SHA256" \
              --verify-tag \
              --generate-notes \
              --title "Detour $VERSION_NAME"
