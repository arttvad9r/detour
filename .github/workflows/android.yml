name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true
          cache-dependency-path: engine/mihomo/go/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108'
      - name: Install Android 16 and Android 17 emulator images
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        run: >-
          sdkmanager 'emulator'
          'system-images;android-36;google_apis;x86_64'
          'system-images;android-37;google_apis;x86_64'
      - name: Export Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install Go tooling
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :baselineprofile:assemble
      - name: Report universal release APK size
        run: >-
          python3 tools/apk_size_report.py app/build/outputs/apk/release
          --expected-abi arm64-v8a
          --expected-abi x86_64
      - name: Verify universal 16 KB ELF alignment
        run: >-
          python3 tools/check_elf_alignment.py app/build/outputs/apk/release
          --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - run: bash engine/vulnscan.sh
      - name: Generate disposable CI release keystore
        shell: bash
        run: |
          set -euo pipefail
          CI_KEYSTORE="$RUNNER_TEMP/detour-ci-release.keystore"
          keytool -genkeypair \
            -keystore "$CI_KEYSTORE" \
            -storepass detour-ci-password \
            -keypass detour-ci-password \
            -alias detour-ci \
            -dname "CN=Detour CI" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt
          chmod 600 "$CI_KEYSTORE"
      - name: Build CI-signed arm64 release APK
        env:
          DETOUR_RELEASE_KEYSTORE: ${{ runner.temp }}/detour-ci-release.keystore
          DETOUR_RELEASE_STORE_PASSWORD: detour-ci-password
          DETOUR_RELEASE_KEY_ALIAS: detour-ci
          DETOUR_RELEASE_KEY_PASSWORD: detour-ci-password
        run: |
          rm -rf app/build/outputs/apk/release
          ./gradlew :app:assembleRelease \
            -PdetourReleaseAbi=arm64-v8a \
            -PdetourVersionName=0.1.0-ci \
            -PdetourVersionCode=1001
      - name: Verify CI-signed arm64 release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          python3 tools/check_elf_alignment.py "$APK" \
            --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 tools/apk_size_report.py "$APK" \
            --report app/build/reports/apk-size-arm64.json \
            --max-bytes 31457280 \
            --expected-abi arm64-v8a
      - name: Upload APK size reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: apk-size-reports
          if-no-files-found: error
          retention-days: 14
          path: app/build/reports/apk-size*.json
      - name: Run instrumentation tests on Android 16 emulator
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        timeout-minutes: 15
        shell: bash
        run: bash tools/run_android_instrumentation_emulator.sh 36
      - name: Run instrumentation tests on Android 17 emulator
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        timeout-minutes: 15
        shell: bash
        run: bash tools/run_android_instrumentation_emulator.sh 37
      - name: Upload instrumentation diagnostics
        if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: instrumentation-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            ${{ runner.temp }}/detour-api*-instrumentation.log
            ${{ runner.temp }}/detour-api*-emulator.log
            ${{ runner.temp }}/detour-api*-logcat.txt
