name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true
          cache-dependency-path: engine/mihomo/go/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools emulator system-images;android-36;google_apis;x86_64 platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108'
      - name: Export Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install Go tooling
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Report release APK size
        run: python3 tools/apk_size_report.py app/build/outputs/apk/release
      - run: bash engine/vulnscan.sh
      - name: Run instrumentation tests on Android 16 emulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME="detour-ci-api36"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          EMULATOR_SERIAL="emulator-5554"
          EMULATOR_LOG="$RUNNER_TEMP/detour-emulator.log"
          SYSTEM_IMAGE="system-images;android-36;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          if [[ ! -x "$EMULATOR" ]]; then
            echo "Android Emulator binary not found: $EMULATOR" >&2
            exit 1
          fi
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          "$EMULATOR" -accel-check || true

          echo "no" | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE"

          if ! "$EMULATOR" -list-avds | grep -Fxq "$AVD_NAME"; then
            echo "Created AVD is not visible to Android Emulator" >&2
            find "$ANDROID_USER_HOME" -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi

          cleanup() {
            adb -s "$EMULATOR_SERIAL" emu kill >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$EMULATOR" "@$AVD_NAME" \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel auto \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!

          adb start-server
          device_ready=0
          for _ in $(seq 1 60); do
            if adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null | grep -qx device; then
              device_ready=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before adb connected" >&2
              tail -n 200 "$EMULATOR_LOG" >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$device_ready" != "1" ]]; then
            echo "Android emulator did not appear in adb" >&2
            adb devices -l >&2 || true
            tail -n 200 "$EMULATOR_LOG" >&2 || true
            exit 1
          fi

          booted=0
          for _ in $(seq 1 120); do
            if [[ "$(adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited while booting" >&2
              tail -n 200 "$EMULATOR_LOG" >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$booted" != "1" ]]; then
            echo "Android emulator did not finish booting" >&2
            tail -n 200 "$EMULATOR_LOG" >&2 || true
            exit 1
          fi

          adb -s "$EMULATOR_SERIAL" shell input keyevent 82 || true
          adb -s "$EMULATOR_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$EMULATOR_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$EMULATOR_SERIAL" shell settings put global animator_duration_scale 0

          if ! ANDROID_SERIAL="$EMULATOR_SERIAL" ./gradlew :app:connectedDebugAndroidTest; then
            echo "--- emulator log ---" >&2
            tail -n 200 "$EMULATOR_LOG" >&2 || true
            echo "--- device logcat ---" >&2
            adb -s "$EMULATOR_SERIAL" logcat -d -t 500 >&2 || true
            exit 1
          fi
