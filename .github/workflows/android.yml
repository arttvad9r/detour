name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Locked flake environment (flake.lock pins nixpkgs revision).
      - run: nix develop -c ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # Go dependency vulnerability gate over the patched pinned engine sources.
      - run: nix develop -c bash engine/vulnscan.sh
