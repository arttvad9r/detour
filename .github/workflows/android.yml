name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true
          cache-dependency-path: engine/mihomo/go/go.sum
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.0.13004108'
      - name: Install Android 16 emulator image
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        run: sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
      - name: Export Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install Go tooling
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :baselineprofile:assemble
      - name: Report universal release APK size
        run: >-
          python3 tools/apk_size_report.py app/build/outputs/apk/release
          --expected-abi arm64-v8a
          --expected-abi x86_64
      - name: Verify universal 16 KB ELF alignment
        run: >-
          python3 tools/check_elf_alignment.py app/build/outputs/apk/release
          --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - run: bash engine/vulnscan.sh
      - name: Generate disposable CI release keystore
        shell: bash
        run: |
          set -euo pipefail
          CI_KEYSTORE="$RUNNER_TEMP/detour-ci-release.keystore"
          keytool -genkeypair \
            -keystore "$CI_KEYSTORE" \
            -storepass detour-ci-password \
            -keypass detour-ci-password \
            -alias detour-ci \
            -dname "CN=Detour CI" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt
          chmod 600 "$CI_KEYSTORE"
      - name: Build CI-signed arm64 release APK
        env:
          DETOUR_RELEASE_KEYSTORE: ${{ runner.temp }}/detour-ci-release.keystore
          DETOUR_RELEASE_STORE_PASSWORD: detour-ci-password
          DETOUR_RELEASE_KEY_ALIAS: detour-ci
          DETOUR_RELEASE_KEY_PASSWORD: detour-ci-password
        run: |
          rm -rf app/build/outputs/apk/release
          ./gradlew :app:assembleRelease \
            -PdetourReleaseAbi=arm64-v8a \
            -PdetourVersionName=0.1.0-ci \
            -PdetourVersionCode=1001
      - name: Verify CI-signed arm64 release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          python3 tools/check_elf_alignment.py "$APK" \
            --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 tools/apk_size_report.py "$APK" \
            --report app/build/reports/apk-size-arm64.json \
            --max-bytes 31457280 \
            --expected-abi arm64-v8a
      - name: Upload APK size reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: apk-size-reports
          if-no-files-found: error
          retention-days: 14
          path: app/build/reports/apk-size*.json
      - name: Run instrumentation tests on Android 16 emulator
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME="detour-ci-api36"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          EMULATOR_SERIAL="emulator-5554"
          EMULATOR_LOG="$RUNNER_TEMP/detour-emulator.log"
          INSTRUMENTATION_LOG="$RUNNER_TEMP/detour-instrumentation.log"
          LOGCAT_LOG="$RUNNER_TEMP/detour-logcat.txt"
          SYSTEM_IMAGE="system-images;android-36;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          if [[ ! -x "$EMULATOR" ]]; then
            echo "Android Emulator binary not found: $EMULATOR" >&2
            exit 1
          fi
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          "$EMULATOR" -accel-check || true

          echo "no" | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE"

          if ! "$EMULATOR" -list-avds | grep -Fxq "$AVD_NAME"; then
            echo "Created AVD is not visible to Android Emulator" >&2
            find "$ANDROID_USER_HOME" -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi

          cleanup() {
            adb -s "$EMULATOR_SERIAL" emu kill >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$EMULATOR" "@$AVD_NAME" \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel auto \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!

          adb start-server
          device_ready=0
          for _ in $(seq 1 60); do
            if adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null | grep -qx device; then
              device_ready=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before adb connected" >&2
              tail -n 200 "$EMULATOR_LOG" >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$device_ready" != "1" ]]; then
            echo "Android emulator did not appear in adb" >&2
            adb devices -l >&2 || true
            tail -n 200 "$EMULATOR_LOG" >&2 || true
            exit 1
          fi

          booted=0
          for _ in $(seq 1 120); do
            if [[ "$(adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited while booting" >&2
              tail -n 200 "$EMULATOR_LOG" >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$booted" != "1" ]]; then
            echo "Android emulator did not finish booting" >&2
            tail -n 200 "$EMULATOR_LOG" >&2 || true
            exit 1
          fi

          adb -s "$EMULATOR_SERIAL" shell input keyevent 82 || true
          adb -s "$EMULATOR_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$EMULATOR_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$EMULATOR_SERIAL" shell settings put global animator_duration_scale 0

          set +e
          ANDROID_SERIAL="$EMULATOR_SERIAL" ./gradlew :app:connectedDebugAndroidTest --stacktrace 2>&1 | tee "$INSTRUMENTATION_LOG"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          if [[ "$TEST_EXIT" -ne 0 ]]; then
            echo "--- instrumentation log tail ---" >&2
            tail -n 250 "$INSTRUMENTATION_LOG" >&2 || true
            echo "--- emulator log ---" >&2
            tail -n 200 "$EMULATOR_LOG" >&2 || true
            adb -s "$EMULATOR_SERIAL" logcat -d -t 1000 > "$LOGCAT_LOG" 2>&1 || true
            echo "--- device logcat ---" >&2
            tail -n 500 "$LOGCAT_LOG" >&2 || true
            exit "$TEST_EXIT"
          fi
      - name: Upload instrumentation diagnostics
        if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: instrumentation-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            ${{ runner.temp }}/detour-instrumentation.log
            ${{ runner.temp }}/detour-emulator.log
            ${{ runner.temp }}/detour-logcat.txt
